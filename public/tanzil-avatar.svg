<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f5132"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2a77a"/>
      <stop offset="100%" stop-color="#c88b5d"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <rect width="400" height="400" rx="200" fill="url(#bg)"/>
  
  <!-- Outer glowing ring -->
  <circle cx="200" cy="200" r="192" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.4"/>
  
  <g transform="translate(0, 15)">
    <!-- Shoulders & White Kurta -->
    <path d="M 80 340 Q 200 290 320 340 L 330 400 L 70 400 Z" fill="#f8fafc" filter="url(#shadow)"/>
    <path d="M 175 305 L 200 370 L 225 305 Z" fill="#e2e8f0"/>
    
    <!-- Scarf / Keffiyeh over Left Shoulder -->
    <path d="M 230 310 C 270 320, 310 350, 325 400 L 265 400 C 250 365, 230 335, 215 320 Z" fill="#cbd5e1" opacity="0.9"/>
    <!-- Scarf pattern lines -->
    <path d="M 240 320 L 300 390 M 255 330 L 310 390 M 270 340 L 320 390" stroke="#475569" stroke-width="2" stroke-dasharray="4,4"/>

    <!-- Neck -->
    <rect x="172" y="230" width="56" height="80" rx="10" fill="#c88b5d"/>
    <path d="M 172 270 Q 200 290 228 270 Z" fill="#b17549" opacity="0.5"/>

    <!-- Head & Face -->
    <ellipse cx="200" cy="180" rx="68" ry="80" fill="url(#skin)" filter="url(#shadow)"/>

    <!-- Eyes -->
    <ellipse cx="172" cy="170" rx="8" ry="5" fill="#1e293b"/>
    <ellipse cx="228" cy="170" rx="8" ry="5" fill="#1e293b"/>
    <circle cx="174" cy="169" r="2" fill="#ffffff"/>
    <circle cx="230" cy="169" r="2" fill="#ffffff"/>
    
    <!-- Eyebrows -->
    <path d="M 158 158 Q 172 152 186 160" fill="none" stroke="#271b12" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 214 160 Q 228 152 242 158" fill="none" stroke="#271b12" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M 200 168 L 195 195 Q 200 200 205 195 Z" fill="#b17549" opacity="0.6"/>

    <!-- Full Beard (Dark/Black) -->
    <path d="M 134 180 C 130 250, 160 300, 200 305 C 240 300, 270 250, 266 180 C 260 215, 245 250, 200 255 C 155 250, 140 215, 134 180 Z" fill="#18181b"/>
    <!-- Moustache -->
    <path d="M 175 208 Q 200 216 225 208 Q 200 212 175 208 Z" fill="#18181b"/>

    <!-- Blue Knitted Prayer Cap (Kufi) -->
    <path d="M 128 160 C 128 85, 272 85, 272 160 C 255 142, 230 135, 200 135 C 170 135, 145 142, 128 160 Z" fill="url(#capGrad)"/>
    <!-- Cap Texture/Pattern -->
    <path d="M 135 140 Q 200 120 265 140" fill="none" stroke="#60a5fa" stroke-width="3" stroke-dasharray="6,4"/>
    <path d="M 142 122 Q 200 102 258 122" fill="none" stroke="#93c5fd" stroke-width="3" stroke-dasharray="5,3"/>
    <path d="M 155 105 Q 200 88 245 105" fill="none" stroke="#bfdbfe" stroke-width="2.5" stroke-dasharray="4,3"/>
  </g>

  <!-- AI & Code Badges -->
  <g transform="translate(290, 40)">
    <circle cx="24" cy="24" r="22" fill="#10b981"/>
    <text x="24" y="29" font-family="sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">AI</text>
  </g>
</svg>
